set -g mouse on
set -g history-limit 50000


# let the Kitty graphics protocol reach the terminal (ghostty) so nvim
# plugins like image.nvim / molten can draw inline images inside tmux
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# gruvbox dark, same colors as ghostty/themes/gruvbox-dark
set -g status-style "bg=#3c3836,fg=#ebdbb2"
set -g status-left-length 32
set -g status-left "#[bg=#a89984,fg=#282828,bold] #S #[default] "
set -g status-right "#[fg=#a89984]%H:%M %d-%b-%y "
set -g window-status-format " #I:#W#F "
set -g window-status-current-format " #I:#W#F "
set -g window-status-style "fg=#a89984"
set -g window-status-current-style "bg=#fabd2f,fg=#282828,bold"
set -g window-status-activity-style "fg=#fe8019"
set -g window-status-bell-style "bg=#cc241d,fg=#ebdbb2"
set -g pane-border-style "fg=#504945"
set -g pane-active-border-style "fg=#fabd2f"
set -g message-style "bg=#fabd2f,fg=#282828"
set -g message-command-style "bg=#fabd2f,fg=#282828"
set -g mode-style "bg=#fabd2f,fg=#282828"
set -g display-panes-colour "#a89984"
set -g display-panes-active-colour "#fabd2f"
set -g clock-mode-colour "#fabd2f"
